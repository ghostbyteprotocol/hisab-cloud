name: Build & Release HisabCloud Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web & Android Project
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Set App Launcher Icon from logo.png
        run: |
          if [ -f "logo.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
              convert logo.png -resize 192x192 android/app/src/main/res/$dir/ic_launcher.png
              convert logo.png -resize 192x192 android/app/src/main/res/$dir/ic_launcher_round.png
              convert logo.png -resize 192x192 android/app/src/main/res/$dir/ic_launcher_foreground.png
            done
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../HisabCloud-Pro.apk

      - name: Create Auto Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HisabCloud Pro v1.0.${{ github.run_number }}
          body: "Latest HisabCloud Pro APK update with new features and bug fixes."
          files: HisabCloud-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
